<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" xml:space="preserve" role="img" aria-label="Let&#x27;s build something. Open to AI evaluation and full-stack roles. Ibadan, Nigeria, WAT (UTC+1)."><title>Let&#x27;s build something. Open to AI evaluation and full-stack roles. Ibadan, Nigeria, WAT (UTC+1).</title><style>@font-face{font-family:'b4x';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
@font-face{font-family:'d7x';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}
@font-face{font-family:'m5x';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
.b4{font-family:'b4x',Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;font-weight:400}
.d7{font-family:'d7x','Chakra Petch', system-ui, sans-serif;font-weight:700}
.m5{font-family:'m5x','JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;font-weight:500}
.reveal{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scan{animation:scan 7s linear infinite}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(var(--h))}}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-40%)}100%{transform:translateX(140%)}}
.travel{animation:travel 4.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="pc"><rect width="1000" height="230" rx="16"/></clipPath><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(0,255,157,.045)" stroke-width="1"/></pattern><linearGradient id="scang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9d" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9d" stop-opacity=".05"/><stop offset="1" stop-color="#00ff9d" stop-opacity="0"/></linearGradient><radialGradient id="vign" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#04070a" stop-opacity="0"/><stop offset="1" stop-color="#04070a" stop-opacity=".55"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g clip-path="url(#pc)"><rect width="1000" height="230" fill="#04070a"/><rect width="1000" height="230" fill="url(#grid)"/><rect width="1000" height="230" fill="url(#vign)"/><rect class="scan" style="--h:270px" y="0" width="1000" height="120" fill="url(#scang)"/></g><rect x=".5" y=".5" width="999" height="229" rx="16" fill="none" stroke="rgba(0,255,157,.14)"/><path d="M10 24V10H24" fill="none" stroke="rgba(0,255,157,.55)" stroke-width="1.5"/><path d="M990 24V10H976" fill="none" stroke="rgba(0,255,157,.55)" stroke-width="1.5"/><path d="M10 206V220H24" fill="none" stroke="rgba(0,255,157,.55)" stroke-width="1.5"/><path d="M990 206V220H976" fill="none" stroke="rgba(0,255,157,.55)" stroke-width="1.5"/><g class="reveal"><text x="44" y="92" class="d7" font-size="44" fill="#d6e4ec" letter-spacing="0.8">LET&#x27;S BUILD</text><text x="321.3" y="92" class="d7" font-size="44" fill="#00ff9d" letter-spacing="0.8">SOMETHING</text></g><rect class="blink" x="584.2" y="84" width="26" height="7" fill="#00ff9d" filter="url(#glow)"/><text x="46" y="136" class="b4" font-size="16" fill="#8193a3">Open to AI evaluation and full-stack roles, and to building products</text><text x="46" y="161" class="b4" font-size="16" fill="#8193a3">with teams anywhere. The links below are the fastest way to reach me.</text><rect x="700" y="118" width="260" height="84" rx="8" fill="#0a1218" stroke="rgba(0,255,157,.14)"/><text x="716" y="142" class="m5" font-size="12.5" fill="#00ff9d">&gt;</text><text x="731" y="142" class="m5" font-size="12.5" fill="#4e6070">status:</text><text x="791" y="142" class="m5" font-size="12.5" fill="#00ff9d">OPEN_TO_WORK</text><text x="716" y="164" class="m5" font-size="12.5" fill="#00ff9d">&gt;</text><text x="731" y="164" class="m5" font-size="12.5" fill="#4e6070">based:</text><text x="783.5" y="164" class="m5" font-size="12.5" fill="#d6e4ec">Ibadan, Nigeria</text><text x="716" y="186" class="m5" font-size="12.5" fill="#00ff9d">&gt;</text><text x="731" y="186" class="m5" font-size="12.5" fill="#4e6070">time:</text><text x="776" y="186" class="m5" font-size="12.5" fill="#d6e4ec">WAT (UTC+1)</text></svg>