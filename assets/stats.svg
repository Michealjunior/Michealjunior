<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" xml:space="preserve" role="img" aria-label="210 AI coding challenges approved at Shipd; 92% approval rate across 227 submissions; 7 tools built and live; 1,250+ automated tests."><title>210 AI coding challenges approved at Shipd; 92% approval rate across 227 submissions; 7 tools built and live; 1,250+ automated tests.</title><style>@font-face{font-family:'d7x';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}
